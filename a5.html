<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄羅斯方塊</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111827;
        color: white;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .game-container {
        display: flex;
        gap: 25px;
        padding: 20px;
        align-items: flex-start;
    }

    canvas {
        background: #0b1020;
        border: 3px solid #374151;
        box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    #game {
        width: 300px;
        height: 600px;
    }

    .side-panel {
        width: 220px;
    }

    h1 {
        margin-top: 0;
        font-size: 30px;
        letter-spacing: 3px;
    }

    .info-box {
        background: #1f2937;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 10px;
    }

    .info-box p {
        margin: 8px 0;
    }

    .value {
        font-size: 22px;
        font-weight: bold;
    }

    #next {
        display: block;
        margin: 10px auto;
        background: #0b1020;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .controls {
        margin-top: 15px;
        color: #d1d5db;
        line-height: 1.8;
    }

    .mobile-controls {
        display: none;
    }

    @media (max-width: 700px) {
        body {
            align-items: flex-start;
        }

        .game-container {
            flex-direction: column;
            align-items: center;
        }

        .side-panel {
            width: 300px;
        }

        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 300px;
        }

        .mobile-controls button {
            margin: 0;
        }

        .mobile-controls .wide {
            grid-column: span 3;
        }
    }
</style>
</head>

<body>

<div class="game-container">

    <div>
        <canvas id="game" width="300" height="600"></canvas>

        <div class="mobile-controls">
            <button onclick="move(-1)">←</button>
            <button onclick="rotatePiece()">↻</button>
            <button onclick="move(1)">→</button>
            <button onclick="softDrop()">↓</button>
            <button class="wide" onclick="hardDrop()">DROP</button>
        </div>
    </div>

    <div class="side-panel">

        <h1>TETRIS</h1>

        <div class="info-box">
            <p>分數</p>
            <div class="value" id="score">0</div>

            <p>最高分</p>
            <div class="value" id="highScore">0</div>

            <p>消除行數</p>
            <div class="value" id="lines">0</div>

            <p>等級</p>
            <div class="value" id="level">1</div>
        </div>

        <div class="info-box">
            <p>下一個</p>
            <canvas id="next" width="120" height="120"></canvas>
        </div>

        <button onclick="startGame()">重新開始</button>
        <button onclick="togglePause()">暫停 / 繼續</button>
        <button onclick="toggleMusic()" id="musicBtn">🔊 音樂：開</button>

        <div class="controls">
            <strong>鍵盤操作</strong><br>
            ← → 移動<br>
            ↑ 旋轉<br>
            ↓ 加速下降<br>
            Space 瞬間落下<br>
            P 暫停
        </div>

    </div>
</div>

<script>

// ==========================================
// Canvas
// ==========================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

// ==========================================
// 顏色
// ==========================================

const colors = [
    null,
    "#00f0f0", // I
    "#f0f000", // O
    "#a000f0", // T
    "#00f000", // S
    "#f00000", // Z
    "#0000f0", // J
    "#f0a000"  // L
];

// ==========================================
// 方塊
// ==========================================

const pieces = [

    [
        [1,1,1,1]
    ],

    [
        [2,2],
        [2,2]
    ],

    [
        [0,3,0],
        [3,3,3]
    ],

    [
        [0,4,4],
        [4,4,0]
    ],

    [
        [5,5,0],
        [0,5,5]
    ],

    [
        [6,0,0],
        [6,6,6]
    ],

    [
        [0,0,7],
        [7,7,7]
    ]

];

// ==========================================
// 遊戲狀態
// ==========================================

let board;
let player;
let nextPiece;

let score = 0;
let lines = 0;
let level = 1;

let dropCounter = 0;
let dropInterval = 800;
let lastTime = 0;

let gameOver = false;
let paused = false;

// ==========================================
// Web Audio
// ==========================================

let audioCtx;
let musicTimer;
let musicOn = true;

function initAudio() {

    if (!audioCtx) {
        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}


// ==========================================
// 音效
// ==========================================

function playSound(freq, duration = 0.08, type = "square") {

    if (!audioCtx) return;

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = type;
    oscillator.frequency.value = freq;

    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
}


// ==========================================
// 背景音樂
// ==========================================

const melody = [
    659, 494, 523, 587,
    523, 494, 440, 440,
    523, 659, 587, 523,
    494, 523, 587, 659
];

let melodyIndex = 0;

function startMusic() {

    if (!musicOn) return;

    clearInterval(musicTimer);

    musicTimer = setInterval(() => {

        if (!musicOn || paused || gameOver) return;

        playSound(
            melody[melodyIndex],
            0.15,
            "triangle"
        );

        melodyIndex++;

        if (melodyIndex >= melody.length) {
            melodyIndex = 0;
        }

    }, 260);
}

function stopMusic() {
    clearInterval(musicTimer);
}

function toggleMusic() {

    musicOn = !musicOn;

    const btn = document.getElementById("musicBtn");

    if (musicOn) {

        btn.textContent = "🔊 音樂：開";

        initAudio();
        startMusic();

    } else {

        btn.textContent = "🔇 音樂：關";

        stopMusic();
    }
}


// ==========================================
// 建立遊戲盤
// ==========================================

function createBoard() {

    return Array.from(
        {length: ROWS},
        () => Array(COLS).fill(0)
    );

}


// ==========================================
// 隨機方塊
// ==========================================

function randomPiece() {

    const index = Math.floor(
        Math.random() * pieces.length
    );

    return pieces[index].map(row => [...row]);

}


// ==========================================
// 玩家生成
// ==========================================

function playerReset() {

    if (!nextPiece) {
        nextPiece = randomPiece();
    }

    player = {
        matrix: nextPiece,
        pos: {
            x: 0,
            y: 0
        }
    };

    nextPiece = randomPiece();

    player.pos.y = 0;

    player.pos.x =
        Math.floor(
            (COLS - player.matrix[0].length) / 2
        );

    drawNext();

    if (collide()) {

        gameOver = true;

        stopMusic();

        playSound(100, 0.5, "sawtooth");

        alert("Game Over!\n你的分數：" + score);
    }
}


// ==========================================
// 碰撞判定
// ==========================================

function collide() {

    const m = player.matrix;
    const o = player.pos;

    for (let y = 0; y < m.length; y++) {

        for (let x = 0; x < m[y].length; x++) {

            if (
                m[y][x] !== 0 &&
                (
                    board[y + o.y] === undefined ||
                    board[y + o.y][x + o.x] === undefined ||
                    board[y + o.y][x + o.x] !== 0
                )
            ) {
                return true;
            }
        }
    }

    return false;
}


// ==========================================
// 合併方塊
// ==========================================

function merge() {

    player.matrix.forEach((row, y) => {

        row.forEach((value, x) => {

            if (value !== 0) {

                board[
                    y + player.pos.y
                ][
                    x + player.pos.x
                ] = value;

            }

        });

    });
}


// ==========================================
// 旋轉
// ==========================================

function rotate(matrix, dir) {

    for (let y = 0; y < matrix.length; ++y) {

        for (let x = 0; x < y; ++x) {

            [
                matrix[x][y],
                matrix[y][x]
            ] =
            [
                matrix[y][x],
                matrix[x][y]
            ];

        }
    }

    if (dir > 0) {
        matrix.forEach(row => row.reverse());
    } else {
        matrix.reverse();
    }
}


function rotatePiece() {

    if (gameOver || paused) return;

    const pos = player.pos.x;

    let offset = 1;

    rotate(player.matrix, 1);

    while (collide()) {

        player.pos.x += offset;

        offset =
            -(offset + (offset > 0 ? 1 : -1));

        if (offset >
            player.matrix[0].length) {

            rotate(player.matrix, -1);

            player.pos.x = pos;

            return;
        }
    }

    playSound(600, 0.07, "square");
}


// ==========================================
// 移動
// ==========================================

function move(dir) {

    if (gameOver || paused) return;

    player.pos.x += dir;

    if (collide()) {

        player.pos.x -= dir;

    } else {

        playSound(300, 0.04, "square");
    }
}


// ==========================================
// 軟下降
// ==========================================

function softDrop() {

    if (gameOver || paused) return;

    player.pos.y++;

    if (collide()) {

        player.pos.y--;

        lockPiece();

    } else {

        score += 1;

        updateUI();
    }

    dropCounter = 0;
}


// ==========================================
// 瞬間下降
// ==========================================

function hardDrop() {

    if (gameOver || paused) return;

    let distance = 0;

    while (!collide()) {

        player.pos.y++;

        distance++;
    }

    player.pos.y--;

    distance--;

    score += distance * 2;

    lockPiece();

    playSound(180, 0.12, "sawtooth");
}


// ==========================================
// 鎖定方塊
// ==========================================

function lockPiece() {

    merge();

    playSound(120, 0.06, "square");

    arenaSweep();

    playerReset();

    dropCounter = 0;

    updateUI();
}


// ==========================================
// 消除完整行
// ==========================================

function arenaSweep() {

    let rowCount = 1;

    outer:

    for (
        let y = board.length - 1;
        y >= 0;
        --y
    ) {

        for (
            let x = 0;
            x < board[y].length;
            ++x
        ) {

            if (board[y][x] === 0) {

                continue outer;
            }
        }

        const row = board.splice(y, 1)[0]
            .fill(0);

        board.unshift(row);

        ++y;

        lines++;

        score += rowCount * 100;

        rowCount *= 2;

    }

    if (rowCount > 1) {

        playSound(800, 0.1, "square");

        setTimeout(
            () => playSound(1000, 0.15, "square"),
            100
        );

        level =
            Math.floor(lines / 10) + 1;

        dropInterval =
            Math.max(
                100,
                800 - (level - 1) * 70
            );
    }
}


// ==========================================
// 繪製方塊
// ==========================================

function drawMatrix(matrix, offset, context = ctx, size = BLOCK) {

    matrix.forEach((row, y) => {

        row.forEach((value, x) => {

            if (value !== 0) {

                context.fillStyle =
                    colors[value];

                context.fillRect(
                    (x + offset.x) * size,
                    (y + offset.y) * size,
                    size - 1,
                    size - 1
                );

                // 高光
                context.fillStyle =
                    "rgba(255,255,255,0.25)";

                context.fillRect(
                    (x + offset.x) * size,
                    (y + offset.y) * size,
                    size - 1,
                    5
                );
            }

        });

    });
}


// ==========================================
// 繪製遊戲
// ==========================================

function draw() {

    ctx.fillStyle = "#0b1020";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMatrix(board, {x:0, y:0});

    if (!gameOver) {
        drawMatrix(
            player.matrix,
            player.pos
        );
    }

    // 網格
    ctx.strokeStyle =
        "rgba(255,255,255,0.04)";

    for (let x = 0; x <= COLS; x++) {

        ctx.beginPath();

        ctx.moveTo(
            x * BLOCK,
            0
        );

        ctx.lineTo(
            x * BLOCK,
            canvas.height
        );

        ctx.stroke();
    }

    for (let y = 0; y <= ROWS; y++) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y * BLOCK
        );

        ctx.lineTo(
            canvas.width,
            y * BLOCK
        );

        ctx.stroke();
    }
}


// ==========================================
// 下一個方塊
// ==========================================

function drawNext() {

    nextCtx.fillStyle = "#0b1020";

    nextCtx.fillRect(
        0,
        0,
        nextCanvas.width,
        nextCanvas.height
    );

    const size = 25;

    const width =
        nextPiece[0].length * size;

    const height =
        nextPiece.length * size;

    const offset = {
        x: (nextCanvas.width - width) / 2 / size,
        y: (nextCanvas.height - height) / 2 / size
    };

    drawMatrix(
        nextPiece,
        offset,
        nextCtx,
        size
    );
}


// ==========================================
// 遊戲迴圈
// ==========================================

function update(time = 0) {

    const deltaTime =
        time - lastTime;

    lastTime = time;

    if (!paused && !gameOver) {

        dropCounter += deltaTime;

        if (dropCounter > dropInterval) {

            player.pos.y++;

            if (collide()) {

                player.pos.y--;

                lockPiece();
            }

            dropCounter = 0;
        }
    }

    draw();

    requestAnimationFrame(update);
}


// ==========================================
// UI
// ==========================================

function updateUI() {

    document.getElementById("score")
        .textContent = score;

    document.getElementById("lines")
        .textContent = lines;

    document.getElementById("level")
        .textContent = level;

    const highScore =
        Number(
            localStorage.getItem("tetrisHighScore") || 0
        );

    if (score > highScore) {

        localStorage.setItem(
            "tetrisHighScore",
            score
        );
    }

    document.getElementById("highScore")
        .textContent =
        Math.max(score, highScore);
}


// ==========================================
// 開始遊戲
// ==========================================

function startGame() {

    initAudio();

    board = createBoard();

    score = 0;
    lines = 0;
    level = 1;

    dropInterval = 800;

    gameOver = false;
    paused = false;

    nextPiece = randomPiece();

    playerReset();

    updateUI();

    startMusic();
}


// ==========================================
// 暫停
// ==========================================

function togglePause() {

    if (gameOver) return;

    paused = !paused;

    if (paused) {

        stopMusic();

    } else {

        initAudio();
        startMusic();
    }
}


// ==========================================
// 鍵盤控制
// ==========================================

document.addEventListener("keydown", event => {

    initAudio();

    if (event.code === "ArrowLeft") {

        event.preventDefault();

        move(-1);

    } else if (event.code === "ArrowRight") {

        event.preventDefault();

        move(1);

    } else if (event.code === "ArrowDown") {

        event.preventDefault();

        softDrop();

    } else if (event.code === "ArrowUp") {

        event.preventDefault();

        rotatePiece();

    } else if (event.code === "Space") {

        event.preventDefault();

        hardDrop();

    } else if (
        event.key.toLowerCase() === "p"
    ) {

        togglePause();
    }

});


// ==========================================
// 啟動
// ==========================================

startGame();

update();

</script>

</body>
</html>
